<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Forkcast</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: single phone column on an 8px grid. Type scale 32 / 24 / 16 / 14 (+12 captions). Palette: one brand teal, one CTA mint, neutrals; amber and red only for status. Components follow shadcn/ui conventions (borders, 2px focus ring, switch, badge). */
:root{
  --bg:#f7f9f8; --card:#ffffff; --muted-bg:#eef2f0; --border:#e2e8e5; --input:#cbd6d0;
  --fg:#0c1a15; --muted:#52645b;
  --brand:#115e59; --brand-ink:#ffffff; --brand-soft:#e1f1ef; --brand-text:#115e59;
  --cta:#10b981; --cta-hover:#0ea574; --cta-ink:#022c22; --ring:#10b981;
  --warn:#8a5200; --warn-bg:#fcefd0; --bad:#b42318; --bad-bg:#fde8e6;
  --shadow-sm:0 1px 2px rgba(12,26,21,.06); --shadow-md:0 8px 24px rgba(12,26,21,.1);
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:40px; --s6:48px; --s8:64px;
  --r1:8px; --r2:12px; --r3:16px; --r4:24px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09100d; --card:#101815; --muted-bg:#17221d; --border:#1f2c26; --input:#2c3d35;
  --fg:#ecf3ef; --muted:#93a79d;
  --brand:#0f766e; --brand-ink:#ffffff; --brand-soft:rgba(45,212,191,.13); --brand-text:#5eead4;
  --cta:#34d399; --cta-hover:#6ee7b7; --cta-ink:#04261b; --ring:#34d399;
  --warn:#fbbf24; --warn-bg:rgba(251,191,36,.13); --bad:#f87171; --bad-bg:rgba(248,113,113,.13);
  --shadow-sm:none; --shadow-md:0 8px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09100d; --card:#101815; --muted-bg:#17221d; --border:#1f2c26; --input:#2c3d35;
  --fg:#ecf3ef; --muted:#93a79d;
  --brand:#0f766e; --brand-ink:#ffffff; --brand-soft:rgba(45,212,191,.13); --brand-text:#5eead4;
  --cta:#34d399; --cta-hover:#6ee7b7; --cta-ink:#04261b; --ring:#34d399;
  --warn:#fbbf24; --warn-bg:rgba(251,191,36,.13); --bad:#f87171; --bad-bg:rgba(248,113,113,.13);
  --shadow-sm:none; --shadow-md:0 8px 24px rgba(0,0,0,.5); color-scheme:dark}
:root[data-mode="light"]{
  --bg:#f7f9f8; --card:#ffffff; --muted-bg:#eef2f0; --border:#e2e8e5; --input:#cbd6d0;
  --fg:#0c1a15; --muted:#52645b;
  --brand:#115e59; --brand-ink:#ffffff; --brand-soft:#e1f1ef; --brand-text:#115e59;
  --cta:#10b981; --cta-hover:#0ea574; --cta-ink:#022c22; --ring:#10b981;
  --warn:#8a5200; --warn-bg:#fcefd0; --bad:#b42318; --bad-bg:#fde8e6;
  --shadow-sm:0 1px 2px rgba(12,26,21,.06); --shadow-md:0 8px 24px rgba(12,26,21,.1); color-scheme:light}
:root[data-mode="dark"]{
  --bg:#09100d; --card:#101815; --muted-bg:#17221d; --border:#1f2c26; --input:#2c3d35;
  --fg:#ecf3ef; --muted:#93a79d;
  --brand:#0f766e; --brand-ink:#ffffff; --brand-soft:rgba(45,212,191,.13); --brand-text:#5eead4;
  --cta:#34d399; --cta-hover:#6ee7b7; --cta-ink:#04261b; --ring:#34d399;
  --warn:#fbbf24; --warn-bg:rgba(251,191,36,.13); --bad:#f87171; --bad-bg:rgba(248,113,113,.13);
  --shadow-sm:none; --shadow-md:0 8px 24px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0; background:var(--bg); color:var(--fg); font-family:var(--font); font-size:16px; line-height:24px;
  padding-block:0; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.app{max-width:520px;margin:0 auto;padding-bottom:112px;min-height:100vh}

/* type scale */
.h1{font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.03em;text-wrap:balance}
.h2{font-size:24px;line-height:32px;font-weight:650;letter-spacing:-.02em;text-wrap:balance}
.lead{font-size:18px;line-height:24px;font-weight:600;letter-spacing:-.01em}
.t{font-size:16px;line-height:24px;font-weight:600}
.sub{font-size:14px;line-height:20px;color:var(--muted)}
.cap{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* layout primitives */
.page{display:flex;flex-direction:column;gap:var(--s3);padding-top:var(--s2)}
.ph{display:flex;flex-direction:column;gap:var(--s1)}
.col{display:flex;flex-direction:column;gap:var(--s2)}
.col-s{display:flex;flex-direction:column;gap:var(--s1)}
.row{display:flex;align-items:center;gap:var(--s2)}
.row-s{display:flex;align-items:center;gap:var(--s1)}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.sep{height:1px;background:var(--border);border:0;margin:0}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:var(--s1);min-height:var(--s8);padding:var(--s1) 0;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:var(--s1);font-weight:700;font-size:18px;line-height:24px;letter-spacing:-.02em}
.logo{width:32px;height:32px;border-radius:var(--r2);background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.logo svg{width:18px;height:18px}
.hwrap{position:relative;flex:1;display:flex;align-items:center;justify-content:flex-end;gap:var(--s1);min-width:0}
.route{display:flex;align-items:center;gap:var(--s1);min-width:0;height:40px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:0 var(--s2);font-size:14px;color:var(--muted);cursor:pointer}
.route:hover{border-color:var(--input)}
.route b{color:var(--fg);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.bell{position:relative;flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--card);display:grid;place-items:center;cursor:pointer}
.bell:hover{border-color:var(--input)}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--cta);color:var(--cta-ink);font-size:12px;line-height:16px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.notif{position:absolute;right:0;top:calc(100% + var(--s1));width:min(344px,100%);background:var(--card);border:1px solid var(--border);border-radius:var(--r3);padding:var(--s1);box-shadow:var(--shadow-md)}
.notif button{display:flex;gap:var(--s2);align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-radius:var(--r2);padding:var(--s2) 12px;cursor:pointer}
.notif button:hover{background:var(--muted-bg)}
.notif .empty{padding:var(--s2);color:var(--muted);font-size:14px;line-height:20px}

/* surfaces */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r3);padding:var(--s2);box-shadow:var(--shadow-sm)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);margin-bottom:var(--s2)}
.stat{background:var(--muted-bg);border-radius:var(--r2);padding:var(--s2)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s1);height:var(--s6);padding:0 var(--s3);border-radius:var(--r2);border:1px solid var(--input);background:var(--card);font-weight:600;font-size:14px;line-height:20px;cursor:pointer;text-decoration:none;color:var(--fg);transition:background .12s,border-color .12s}
.btn:hover{background:var(--muted-bg)}
.btn.primary{background:var(--cta);border-color:var(--cta);color:var(--cta-ink)}
.btn.primary:hover{background:var(--cta-hover);border-color:var(--cta-hover)}
.btn.sm{height:var(--s5);padding:0 var(--s2);border-radius:var(--r1)}
.btn.block{width:100%}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--muted-bg);color:var(--fg)}
.btn[disabled]{opacity:.5;cursor:not-allowed;pointer-events:none}
.icon-btn{width:var(--s5);height:var(--s5);border-radius:var(--r1);border:0;background:transparent;cursor:pointer;color:var(--muted);display:grid;place-items:center;flex:none}
.icon-btn:hover{color:var(--fg);background:var(--muted-bg)}
:focus-visible{outline:0;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ring)}

/* form controls */
input[type=text],input[type=number],select{width:100%;height:var(--s6);background:var(--card);border:1px solid var(--input);border-radius:var(--r2);padding:0 var(--s2);color:var(--fg);font-size:16px}
input[type=text]:focus,input[type=number]:focus,select:focus{outline:0;border-color:var(--ring);box-shadow:0 0 0 3px var(--brand-soft)}
input::placeholder{color:var(--muted);opacity:.7}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 22px) 21px,calc(100% - 16px) 21px;background-size:6px 6px;background-repeat:no-repeat;padding-right:var(--s5)}
.field{display:flex;flex-direction:column;gap:var(--s1)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s1)}
.chip{height:var(--s5);padding:0 var(--s2);border-radius:999px;border:1px solid var(--input);background:var(--card);color:var(--fg);font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:var(--s1);white-space:nowrap}
.chip:hover{background:var(--muted-bg)}
.chip[aria-pressed=true]{background:var(--brand-soft);border-color:var(--brand-text);color:var(--brand-text);font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--muted-bg);border-radius:var(--r2);padding:4px;gap:4px}
.seg button{height:40px;border:0;border-radius:var(--r1);background:transparent;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.16)}
.switch{position:relative;width:48px;height:32px;border-radius:16px;border:0;background:var(--input);cursor:pointer;flex:none;padding:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch[aria-checked=true]{background:var(--brand)}
.switch[aria-checked=true]::after{transform:translateX(16px)}
.chk{width:24px;height:24px;border-radius:var(--r1);border:2px solid var(--input);background:transparent;display:grid;place-items:center;cursor:pointer;color:transparent;flex:none;padding:0}
.chk:hover{border-color:var(--brand-text)}
.chk[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
input[type=range]{width:100%;accent-color:var(--brand);height:24px;margin:0}

/* badges and notes */
.pill{display:inline-flex;align-items:center;gap:4px;height:24px;font-size:12px;line-height:16px;font-weight:600;border-radius:999px;padding:0 var(--s1);background:var(--muted-bg);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--brand-soft);color:var(--brand-text)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.note{font-size:12px;line-height:16px;color:var(--muted)}
.banner{display:flex;gap:var(--s2);align-items:center;justify-content:space-between;background:var(--warn-bg);color:var(--warn);border-radius:var(--r2);padding:12px var(--s2);font-size:14px;line-height:20px}
.err{background:var(--bad-bg);color:var(--bad);border-radius:var(--r2);padding:12px var(--s2);font-size:14px;line-height:20px}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) 0;border-top:1px solid var(--border)}
.item:first-child{border-top:0;padding-top:0}
.item:last-child{padding-bottom:0}
.item.tight{padding:var(--s1) 0}
.emo{width:48px;height:48px;border-radius:var(--r2);background:var(--muted-bg);display:grid;place-items:center;font-size:24px;line-height:1;flex:none}
.emo.sm{width:40px;height:40px;font-size:20px}
.item .t{overflow-wrap:anywhere}
.empty-state{display:flex;flex-direction:column;align-items:center;gap:var(--s1);text-align:center;padding:var(--s4) var(--s2);color:var(--muted)}

/* scan */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s1);text-align:center;min-height:200px;border:2px dashed var(--input);border-radius:var(--r4);background:var(--card);cursor:pointer;padding:var(--s3);overflow:hidden;color:var(--brand-text)}
.drop b{color:var(--fg);font-size:18px;line-height:24px}
.drop:hover{border-color:var(--brand-text);background:var(--brand-soft)}
.drop img{max-width:100%;max-height:264px;border-radius:var(--r2);display:block}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.found input[type=text]{height:var(--s5);padding:0 12px;font-size:14px}
.found .qty{width:72px}
.spin{width:16px;height:16px;border:2px solid var(--input);border-top-color:var(--brand-text);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* dinners */
.ask{display:flex;gap:var(--s1)}
.ask input{flex:1;min-width:0}
.ask .btn{padding:0 var(--s2)}
.rcard{display:flex;flex-direction:column;gap:var(--s2)}
.rtop{display:flex;gap:var(--s2);align-items:flex-start}
.rtop .emo{width:56px;height:56px;font-size:28px}
.meta{display:flex;gap:var(--s1);flex-wrap:wrap}
.have,.need{display:flex;flex-wrap:wrap;gap:var(--s1)}
.tag{font-size:14px;line-height:20px;border-radius:var(--r1);padding:4px var(--s1)}
.tag.h{background:var(--brand-soft);color:var(--brand-text)}
.tag.n{background:var(--warn-bg);color:var(--warn)}
details summary{cursor:pointer;color:var(--muted);font-size:14px;line-height:20px;font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
details ol{margin:var(--s1) 0 0;padding-left:var(--s3);font-size:14px;line-height:20px}
details li{margin-bottom:4px}
.cats{display:flex;gap:var(--s1);overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats .chip{flex:none}

/* profile */
.dial-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:var(--s1)}
.dial-h label{font-weight:600;font-size:16px;line-height:24px}
.dial-h output{color:var(--brand-text);font-size:14px;font-weight:600}
.bmi{font-size:40px;line-height:48px;font-weight:700;letter-spacing:-.03em}
.bar{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,#60a5fa 0 25%,#34d399 25% 50%,#fbbf24 50% 80%,#f87171 80%);margin:var(--s2) 0 var(--s1)}
.bar i{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--fg);transform:translateX(-2px)}
.scale{display:flex;justify-content:space-between;font-size:12px;line-height:16px;color:var(--muted)}

/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:25;background:var(--card);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav>div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;height:var(--s8);padding:var(--s1) 0;border:0;background:none;color:var(--muted);font-size:12px;line-height:16px;font-weight:600;cursor:pointer}
.nav .ni{width:56px;height:32px;border-radius:16px;display:grid;place-items:center}
.nav .ni svg{width:24px;height:24px}
.nav button[aria-current=page]{color:var(--brand-text)}
.nav button[aria-current=page] .ni{background:var(--brand-soft)}
.nav .badge{top:var(--s1);left:calc(50% + 8px);right:auto;min-width:20px;border-color:var(--card)}

/* modal + toast */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,14,12,.55);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.sheet{width:100%;max-width:520px;max-height:100%;overflow:auto;background:var(--card);border-radius:var(--r4) var(--r4) 0 0;padding:var(--s3) max(16px,env(safe-area-inset-left,0px)) calc(var(--s3) + env(safe-area-inset-bottom,0px))}
@media(min-width:560px){.scrim{align-items:center}.sheet{border-radius:var(--r4);max-height:92vh}}
.prog{display:flex;gap:var(--s1);margin-bottom:var(--s3)}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--muted-bg)}
.prog i.on{background:var(--brand)}
.opt{display:flex;gap:var(--s2);align-items:center;width:100%;text-align:left;padding:var(--s2);border-radius:var(--r3);border:1px solid var(--input);background:var(--card);cursor:pointer}
.opt:hover{background:var(--muted-bg)}
.opt[aria-pressed=true]{border-color:var(--brand-text);background:var(--brand-soft)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--fg);color:var(--bg);font-weight:600;font-size:14px;line-height:20px;padding:12px var(--s2);border-radius:var(--r2);max-width:calc(100vw - 32px);box-shadow:var(--shadow-md)}
/* hero banner at the top of each tab */
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:var(--s2);min-height:136px;padding:var(--s3);border-radius:var(--r4);background:var(--brand-soft)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero::before{width:160px;height:160px;right:-48px;top:-64px;background:var(--cta);opacity:.14}
.hero::after{width:96px;height:96px;left:-32px;bottom:-56px;background:var(--brand);opacity:.1}
.hero .txt{position:relative;z-index:1;flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:var(--s1)}
.hero .art{position:relative;z-index:1;flex:none;width:112px;height:96px}
.art .g-l{fill:none;stroke:var(--brand);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.art .g-d{fill:none;stroke:var(--brand-text);stroke-width:2;stroke-linecap:round;stroke-dasharray:2 7;opacity:.7}
.art .g-m{fill:none;stroke:var(--brand-text);stroke-width:3;stroke-linecap:round;opacity:.55}
.art .g-o{fill:none;stroke:var(--cta);stroke-width:3;stroke-linecap:round}
.art .g-sk{fill:var(--card);stroke:var(--brand);stroke-width:3;stroke-linejoin:round}
.art .g-c{fill:var(--cta)}
.art .g-b{fill:var(--brand)}
.art .g-t{fill:var(--brand-text)}
/* file buttons: the real input sits invisibly on top so the tap goes straight to it */
.filebtn{position:relative;overflow:hidden}
.filebtn input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
/* theme swatches + avatar picker */
.swatches{display:flex;flex-wrap:wrap;gap:var(--s2)}
.swatch{position:relative;width:48px;height:48px;border-radius:50%;border:2px solid var(--border);padding:0;cursor:pointer;display:grid;place-items:center;overflow:hidden}
.swatch:hover{border-color:var(--input)}
.swatch.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg)}
.swatch.custom{background:conic-gradient(#f43f5e,#f59e0b,#84cc16,#10b981,#3b82f6,#8b5cf6,#f43f5e)}
.swatch input[type=color]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.avatars{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--s1)}
.av{aspect-ratio:1;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer;display:grid;place-items:center;overflow:hidden;font-size:24px;line-height:1;background:var(--muted-bg)}
.av:hover{border-color:var(--input)}
.av[aria-pressed=true]{border-color:var(--brand-text);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--brand-text)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
/* avatar */
.avatar{width:72px;height:72px;border-radius:50%;background:var(--brand-soft);color:var(--brand-text);display:grid;place-items:center;font-size:24px;line-height:32px;font-weight:700;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar svg{width:32px;height:32px}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}.switch,.switch::after,.btn{transition:none}}

const hx=c=>{c=c.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');return[0,2,4].map(i=>parseInt(c.slice(i,i+2),16))};
const toHex=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mixc=(a,b,t)=>{const x=hx(a),y=hx(b);return toHex(x.map((v,i)=>v+(y[i]-v)*t))};
const rlum=c=>{const k=hx(c).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*k[0]+.7152*k[1]+.0722*k[2]};
const contrast=(a,b)=>{const x=rlum(a),y=rlum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const inkFor=bg=>contrast(bg,'#ffffff')>=contrast(bg,'#0c1a15')?'#ffffff':'#0c1a15';
const isDark=()=>{
  if(S.mode==='dark')return true;

  const t=document.documentElement.getAttribute('data-theme');
  return t==='dark'||(t!=='light'&&!!window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
};
const toHsl=c=>{const [r,g,b]=hx(c).map(v=>v/255),mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let hh=0,s=0;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);hh=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;hh*=60}return[hh,s,l]};
const THEME_VARS=['--brand','--brand-ink','--brand-soft','--brand-text','--cta','--cta-hover','--cta-ink','--ring','--bg','--card','--muted-bg','--border','--input','--fg','--muted','--shadow-sm','--shadow-md'];
const fixCta=c=>{for(let i=0;i<8&&contrast(inkFor(c),c)<4.5;i++)c=mixc(c,inkFor(c)==='#ffffff'?'#000000':'#ffffff',.08);return c};
function applyTheme(){
  const r=document.documentElement;
  const hex=S.theme==='custom'?S.themeHex:((THEMES.find(t=>t[0]===S.theme)||[])[2]);
  if(!hex||S.theme==='forkcast'){THEME_VARS.forEach(v=>r.style.removeProperty(v));return}
  const [H,Ssrc]=toHsl(hex),k=Math.max(.35,Math.min(1,Ssrc*1.1)),H0=Math.round(H);
  const hs=(s,l)=>'hsl('+H0+','+Math.round(s*k)+'%,'+l+'%)';
  let v;
  if(isDark()){
    const cta=fixCta(mixc(hex,'#ffffff',.12)),brand=mixc(hex,'#000000',.4),[R,G,B]=hx(hex);
    v={'--brand':brand,'--brand-ink':inkFor(brand),'--brand-soft':'rgba('+R+','+G+','+B+',.14)','--brand-text':mixc(hex,'#ffffff',.5),'--cta':cta,'--cta-hover':mixc(cta,'#ffffff',.18),'--cta-ink':inkFor(cta),'--ring':cta,
       '--bg':hs(32,5.5),'--card':hs(26,8.5),'--muted-bg':hs(24,12.5),'--border':hs(22,17),'--input':hs(18,25),'--fg':hs(24,94),'--muted':hs(12,66),'--shadow-sm':'none','--shadow-md':'0 8px 24px rgba(0,0,0,.5)'};
  }else{
    const brand=mixc(hex,'#000000',.5),cta=fixCta(hex);
    v={'--brand':brand,'--brand-ink':inkFor(brand),'--brand-soft':mixc(hex,'#ffffff',.88),'--brand-text':brand,'--cta':cta,'--cta-hover':mixc(cta,'#000000',.12),'--cta-ink':inkFor(cta),'--ring':cta,
       '--bg':hs(28,96.5),'--card':'#ffffff','--muted-bg':hs(24,93),'--border':hs(20,89),'--input':hs(16,80),'--fg':hs(40,9),'--muted':hs(12,36),
       '--shadow-sm':'0 1px 2px hsla('+H0+',40%,10%,.06)','--shadow-md':'0 8px 24px hsla('+H0+',40%,10%,.1)'};
  }
  for(const key in v)r.style.setProperty(key,v[key]);
}
function applyMode(){
  const r=document.documentElement;
  if(S.mode==='light'||S.mode==='dark')r.setAttribute('data-mode',S.mode);else r.removeAttribute('data-mode');
  applyTheme();
}

/* ---------- helpers ---------- */
const norm=s=>String(s).toLowerCase().replace(/[^a-z\s]/g,' ').split(/\s+/).filter(Boolean).map(w=>w.length>3?w.replace(/(es|s)$/,''):w);
function same(a,b){const x=norm(a),y=norm(b);if(!x.length||!y.length)return false;const [s,l]=x.length<=y.length?[x,y]:[y,x];return s.every(w=>l.includes(w))}
function findFridge(name){return S.fridge.find(f=>same(f.name,name))}
const hasItem=n=>{const f=findFridge(n);return !!f&&f.qty>0};
function priceFor(name){const n=String(name).toLowerCase();for(const [k,p] of PRICES)if(n.includes(k))return p*(STORES[S.route.store]||1);return 3*(STORES[S.route.store]||1)}
const money=v=>'S$'+v.toFixed(2);
const fmtQty=(q,u)=>(Math.round(q*100)/100)+(u?(/^(g|ml|kg|l)$/.test(u)?'':' ')+u:'');
const ageDays=ts=>Math.max(0,Math.floor((Date.now()-ts)/DAY));
function parseQty(str){
  str=String(str||'').trim();if(!str)return null;
  let m=str.match(/^(\d+(?:\.\d+)?)\s*(kg|g|ml|l|pcs?|packs?|bunch(?:es)?|x)?\s*(?:of\s+)?(.+)$/i);
  if(m)return{name:cap(m[3]),qty:+m[1],unit:/^x$/i.test(m[2]||'')?'':(m[2]||'').toLowerCase()};
  m=str.match(/^(.+?)\s*(?:x|×)\s*(\d+)$/i);
  if(m)return{name:cap(m[1]),qty:+m[2],unit:''};
  return{name:cap(str),qty:1,unit:''};
}
const cap=s=>{s=String(s).trim();return s.charAt(0).toUpperCase()+s.slice(1)};
function addToFridge(it,src){
  const ex=findFridge(it.name);
  if(ex){ex.qty=Math.round((ex.qty+(+it.qty||1))*100)/100;if(!ex.unit&&it.unit)ex.unit=it.unit;ex.ts=Date.now();if(ex.src==='example')ex.src=src||'manual';return}
  S.fridge.unshift({id:uid(),name:cap(it.name),emoji:it.emoji||emojiFor(it.name),qty:+it.qty||1,unit:it.unit||'',ts:Date.now(),src:src||'manual'});
}
function toast(msg){const t=$('#toast');t.innerHTML='<div class="toast">'+esc(msg)+'</div>';clearTimeout(T.toastT);T.toastT=setTimeout(()=>{t.innerHTML=''},2600)}
function violates(r){
  const text=r.ing.map(i=>i.name).join(' | ')+' | '+r.name;
  for(const [k] of DIETS)if(S.diet[k]&&RX[k].test(text))return k;
  const terms=String(S.allergies||'').split(/[,;\n]/).map(s=>s.trim().toLowerCase()).filter(s=>s.length>1);
  for(const t of terms){const base=t.replace(/s$/,'');if(text.toLowerCase().includes(base))return 'allergy'}
  return '';
}
function decorate(r){r.have=r.ing.filter(i=>hasItem(i.name));r.need=r.ing.filter(i=>!hasItem(i.name));return r}
const maxSpice=()=>{const m=[0,1,2,3,3][S.taste.spicy];return (S.kid||S.household==='family')&&S.kid?Math.min(m,1):m};
function localRecipes(q){
  q=String(q||'').toLowerCase();
  let list=RECIPES.filter(r=>!violates(r)&&r.spice<=maxSpice());
  const mm=q.match(/(\d+)\s*-?\s*min/);
  if(mm)list=list.filter(r=>r.min<=+mm[1]);else if(/quick|fast|15|10/.test(q))list=list.filter(r=>r.min<=20);
  if(/kid|child|mild/.test(q))list=list.filter(r=>r.kid&&r.spice<=1);
  if(/spicy|hot|sambal/.test(q))list=RECIPES.filter(r=>!violates(r)&&r.spice>=2).concat([]);
  const words=q.match(/chicken|egg|fish|salmon|tofu|beef|rice|noodle|pasta|prawn|mushroom|soup|curry|potato|veg/g);
  if(words){const f=list.filter(r=>words.some(w=>(r.name+' '+r.ing.map(i=>i.name).join(' ')).toLowerCase().includes(w==='veg'?'kailan':w)));if(f.length)list=f}
  list=list.map(r=>decorate(Object.assign({},r)));
  list.sort((a,b)=>(b.have.length/b.ing.length)-(a.have.length/a.ing.length)||a.min-b.min);
  return list;
}
function bodyCalc(){
  const b=S.body,hm=(+b.h)/100,w=+b.w;if(!(hm>0.9&&hm<2.5&&w>20&&w<300))return null;
  const bmi=w/(hm*hm);let cat,tone,txt,pos;
  if(bmi<18.5){cat='Underweight';tone='warn';txt='Below 18.5. Add energy-dense, protein-rich meals.'}
  else if(bmi<23){cat='Healthy weight';tone='ok';txt='18.5 to 22.9 is low risk on the Singapore scale.'}
  else if(bmi<27.5){cat='Overweight';tone='warn';txt='23 to 27.4 is moderate risk on the Singapore scale.'}
  else{cat='High risk';tone='bad';txt='27.5 and above is high risk on the Singapore scale.'}
  pos=Math.max(0,Math.min(100,((bmi-15)/(35-15))*100));
  const age=+b.age||30,bmr=10*w+6.25*(+b.h)-5*age+(b.sex==='male'?5:-161);
  const tdee=bmr*(+b.act||1.375),target=Math.max(1200,Math.round((tdee+(+b.goal||0))/10)*10);
  return{bmi,cat,tone,txt,pos,tdee:Math.round(tdee/10)*10,target,dinner:Math.round(target*.35/10)*10};
}

/* ---------- alerts ---------- */
function alerts(){
  const a=[];
  S.fridge.forEach(f=>{
    if(f.qty<=1&&!/rice|noodle|pasta/i.test(f.name)&&f.qty>0)a.push({ic:'📉',t:'Running low on '+f.name,s:'Only '+fmtQty(f.qty,f.unit)+' left.',go:'gaps'});
    const d=ageDays(f.ts);if(PERISH.test(f.name)&&d>=4&&f.qty>0)a.push({ic:'⏳',t:f.name+' is '+d+' days old',s:'Plan a dinner that uses it soon.',go:'dinners'});
  });
  const open=S.list.filter(x=>!x.done).length;
  if(open)a.push({ic:'🛒',t:open+' item'+(open>1?'s':'')+' to pick up',s:'On your route at '+S.route.station+'.',go:'gaps'});
  return a.slice(0,8);
}

const CATS=[['all','All'],['quick','Under 15 min'],['veg','Vegetarian'],['lowcarb','Low carb'],['soup','Soups & porridge'],['rice','Rice & noodles'],['spicy','Spicy']];
function catOK(r,c){
  const t=r.ing.map(i=>i.name).join(' | ')+' | '+r.name;
  if(c==='quick')return r.min<=15;
  if(c==='veg')return !RX.vegetarian.test(t);
  if(c==='lowcarb')return !RX.lowcarb.test(t);
  if(c==='soup')return /soup|congee|porridge/i.test(r.name);
  if(c==='rice')return /rice|noodle|pasta|spaghetti|congee|bee hoon|vermicelli/i.test(t);
  if(c==='spicy')return r.spice>=2;
  return true;
}

  T.dBusy=true;T.ctl=new AbortController();render();
  const fridge=S.fridge.filter(f=>f.qty>0).map(f=>`${f.name} (${fmtQty(f.qty,f.unit)}, ${ageDays(f.ts)}d old)`).join('; ')||'empty';
  const prompt=`You are the recipe engine inside Forkcast, a kitchen app for busy commuters in Singapore. Suggest 3 dinners that take about 30 minutes or less and use ingredients sold in Singapore supermarkets such as FairPrice. Prefer ingredients already in the fridge, and use older perishables first.\n\n${profileText()}\n\nFridge: ${fridge}\n\nRequest: ${q||'Surprise me with sensible weeknight dinners.'}\n\nReply with only a JSON array of 3 objects like {"name":"Tomato egg rice","emoji":"🍳","minutes":15,"spice":0,"kidFriendly":true,"summary":"One short sentence.","ingredients":[{"name":"Eggs","qty":3,"unit":"pcs"}],"steps":["Short step."]}. "spice" is 0 to 3. List every ingredient except basic pantry items (oil, salt, pepper, sugar, soy sauce, water). Use plain supermarket names such as "Chicken breast". Give 3 to 5 steps.`;
  try{
    const out=await sample.json(prompt,{modelTier:'default',signal:T.ctl.signal,cache:false});
    const arr=(Array.isArray(out)?out:(out&&out.recipes)||[]).slice(0,4);
    const rs=arr.map(o=>{if(!o||!o.name||!Array.isArray(o.ingredients))return null;return{name:String(o.name).slice(0,80),emoji:String(o.emoji||'🍽️').slice(0,4),min:Math.max(5,Math.min(90,+o.minutes||25)),spice:Math.max(0,Math.min(3,Math.round(+o.spice||0))),kid:!!o.kidFriendly,summary:String(o.summary||'').slice(0,200),ing:o.ingredients.slice(0,14).map(i=>({name:String(i.name||'').slice(0,40),n:+i.qty||1,u:String(i.unit||'').slice(0,12)})).filter(i=>i.name),steps:(o.steps||[]).slice(0,7).map(s=>String(s).slice(0,240)),src:'ai'}}).filter(Boolean);
    const safe=rs.filter(r=>!violates(r));
    if(!safe.length)throw {code:'invalid_json'};
    T.recipes=safe.map(decorate);T.rSrc='ai';
    if(safe.length<rs.length)T.dErr='Dropped '+(rs.length-safe.length)+' idea(s) that clashed with your dietary settings.';
  }catch(e){
    const c=errCopy(e);
    T.recipes=localRecipes(q);T.rSrc='local';
    if(c)T.dErr=c+' Showing built-in recipes instead.';
  }
  T.dBusy=false;T.ctl=null;render();
}
function shrink(file,max){return new Promise(res=>{try{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{try{const w=img.naturalWidth,hh=img.naturalHeight,k=Math.min(1,max/Math.max(w,hh)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(hh*k));c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);res(b||file)},'image/jpeg',.85)}catch(_){res(file)}};img.onerror=()=>{URL.revokeObjectURL(u);res(file)};img.src=u}catch(_){res(file)}})}
async function identify(){
  if(!T.file||!sample||T.scanBusy)return;
  T.scanBusy=true;T.scanErr='';T.found=null;T.sctl=new AbortController();render();
  const food='This photo shows groceries, fresh produce, or a fridge or pantry shelf in Singapore. Identify each distinct food item you can see and estimate a quantity. Reply with only a JSON object like {"items":[{"name":"Tomatoes","qty":4,"unit":"pcs"}]}. Use plain supermarket names, qty as a number, and unit as pcs, g, ml, pack or bunch. Skip anything that is not food.';
  const rec='This is a photo of a paper supermarket receipt from Singapore (for example FairPrice, Cold Storage, Sheng Siong or Prime). Extract the grocery line items. Ignore totals, GST, discounts, bags, payment lines and membership lines. Turn abbreviated product text into a plain food name (for example "FP LF MILK 1L" becomes "Low fat milk"). Reply with only a JSON object like {"store":"FairPrice","items":[{"name":"Eggs","qty":10,"unit":"pcs"}]}. qty is a number and unit is pcs, g, kg, ml, l or pack. If the image is not a receipt, reply {"items":[]}.';
  try{
    const blob=await shrink(T.file,T.mode==='receipt'?2000:1600);
    const out=await sample.json(T.mode==='food'?food:rec,{images:blob,modelTier:'default',cache:false,signal:T.sctl.signal});
    const arr=Array.isArray(out)?out:(out&&out.items)||[];
    const items=arr.slice(0,40).map(i=>i&&i.name?{id:uid(),name:cap(String(i.name).slice(0,50)),qty:+i.qty>0?+i.qty:1,unit:String(i.unit||'').slice(0,10),emoji:emojiFor(i.name),on:true}:null).filter(Boolean);
    if(!items.length)T.scanErr=T.mode==='food'?'No food was recognised. Try a closer, brighter photo.':'No line items were found. Flatten the receipt and make sure the text is sharp.';
    else T.found={store:(out&&out.store)||'',items};
  }catch(e){const c=e&&e.code;T.scanErr=c==='cancelled'?'':((errCopy(e)||'')+(c?' ['+c+']':''));if(c)T.lastErr=c+(e.message?': '+String(e.message).slice(0,160):'')}
  T.scanBusy=false;T.sctl=null;render();
}
function demoFound(){
  const items=[['Eggs',10,'pcs'],['Chicken breast',2,'pcs'],['Broccoli',1,'head'],['Spring onion',1,'bunch'],['Low fat milk',1000,'ml']].map(a=>({id:uid(),name:a[0],qty:a[1],unit:a[2],emoji:emojiFor(a[0]),on:true}));
  T.found={store:'Example basket',items,example:true};T.scanErr='';render();
}

/* ---------- events ---------- */
function setPath(p,v){const [a,b]=p.split('.');if(b===undefined)S[a]=v;else S[a][b]=v}
function go(tab){S.tab=tab;T.notif=false;save();render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){if(T.notif&&!e.target.closest('.notif')){T.notif=false;renderHeader()}return}
  const act=el.dataset.act,v=el.dataset.v,id=el.dataset.id;
  switch(act){
    case 'tab':go(v);break;
    case 'bell':T.notif=!T.notif;renderHeader();break;
    case 'nogo':go(v);break;
    case 'mode':T.mode=v;T.found=null;T.scanErr='';render();break;
    case 'photo-clear':T.file=null;if(T.prev)URL.revokeObjectURL(T.prev);T.prev='';T.found=null;T.scanErr='';render();break;
    case 'identify':identify();break;
    case 'diag':T.diagOpen=!T.diagOpen;render();break;
    case 'avatar-rm':S.avatar='';S.avatarUp='';save();render();break;
    case 'av':S.avatar=v;save();render();break;
    case 'mode-toggle':S.mode=isDark()?'light':'dark';save();applyMode();render();break;
    case 'mode-set':S.mode=v;save();applyMode();render();break;
    case 'theme':{S.theme=v;const t=THEMES.find(x=>x[0]===v);if(t)S.themeHex=t[2];save();applyTheme();render();break}
    case 'scan-stop':if(T.sctl)T.sctl.abort();break;
    case 'demo':demoFound();break;
    case 'found-toggle':{const i=T.found.items.find(x=>x.id===id);if(i){i.on=!i.on;render()}break}
    case 'found-clear':T.found=null;render();break;
    case 'found-add':{const on=T.found.items.filter(i=>i.on);on.forEach(i=>addToFridge(i,T.found.example?'manual':'scan'));T.found=null;save();toast('Added '+on.length+' item'+(on.length===1?'':'s')+' to your fridge');go('fridge');break}
    case 'use':{const f=S.fridge.find(x=>x.id===id);if(f){const step=/^(g|ml)$/.test(f.unit)?100:1;f.qty=Math.round((f.qty-step)*100)/100;if(f.qty<=0){S.fridge=S.fridge.filter(x=>x.id!==id);toast(f.name+' used up')}save();render()}break}
    case 'rm':S.fridge=S.fridge.filter(x=>x.id!==id);save();render();break;
    case 'clear-ex':S.fridge=S.fridge.filter(f=>f.src!=='example');save();render();break;
    case 'sync':{T.syncing=true;render();setTimeout(()=>{[['Eggs',10,'pcs'],['Fresh milk',1000,'ml'],['Cucumber',2,'pcs'],['Spaghetti',500,'g']].forEach(a=>addToFridge({name:a[0],qty:a[1],unit:a[2]},'ereceipt'));T.syncing=false;save();render();toast('4 items synced from a sample FairPrice e-receipt')},1100);break}
    case 'ask':T.query=v;askDinners(v);break;
    case 'cat':T.cat=v;T.limit=4;render();break;
    case 'more':T.limit+=4;render();break;
    case 'stop':if(T.ctl)T.ctl.abort();break;
    case 'cook':{const r=T.recipes[+el.dataset.i];if(!r)break;let n=0;r.need.forEach(x=>{if(!S.list.some(l=>!l.done&&same(l.name,x.name))){S.list.push({id:uid(),name:x.name,from:r.name,done:false});n++}});save();if(r.need.length){toast(n?('Added '+n+' item'+(n===1?'':'s')+' to your route list'):'Already on your list');go('gaps')}else toast('You have everything. Enjoy!');break}
    case 'line':S.route.line=v;S.route.station=LINES[v].st.includes(S.route.station)?S.route.station:LINES[v].st[0];save();render();break;
    case 'store':S.route.store=v;save();render();break;
    case 'buy':{const x=S.list.find(l=>l.id===id);if(x){addToFridge({name:x.name,qty:1},'bought');S.list=S.list.filter(l=>l.id!==id);save();render();toast(x.name+' moved to your fridge')}break}
    case 'del':S.list=S.list.filter(l=>l.id!==id);save();render();break;
    case 'buyall':{const n=S.list.length;S.list.forEach(x=>addToFridge({name:x.name,qty:1},'bought'));S.list=[];save();render();toast(n+' items moved to your fridge');break}
    case 'diet':S.diet[v]=!S.diet[v];if(v==='vegan'&&S.diet.vegan)S.diet.vegetarian=true;T.recipes=[];save();render();break;
    case 'kid':S.kid=!S.kid;T.recipes=[];save();render();break;
    case 'hh':S.household=v;if(v==='family')S.kid=true;T.recipes=[];save();render();break;
    case 'redo':T.ob=0;renderModal();break;
    case 'ob-next':T.ob=Math.min(3,T.ob+1);renderModal();break;
    case 'ob-back':T.ob=Math.max(0,T.ob-1);renderModal();break;
    case 'ob-skip':case 'ob-finish':S.onboarded=true;T.ob=-1;T.recipes=[];save();render();window.scrollTo(0,0);if(act==='ob-finish')toast('Preferences saved');break;
  }
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  const kind=f.dataset.form,inp=f.querySelector('input'),val=(inp.value||'').trim();
  if(kind==='ask'){askDinners(val);return}
  if(!val)return;
  if(kind==='quick'){const it=parseQty(val);addToFridge(it,'manual');save();render();toast('Added '+it.name+' to your fridge')}
  if(kind==='listadd'){const it=parseQty(val);S.list.push({id:uid(),name:it.name,from:'',done:false});save();render()}
});
function avBg(){const m=/^p:(\d+)$/.exec(S.avatar||'');return m&&AVATARS[+m[1]]?AVATARS[+m[1]][1]:''}
function avatarHtml(){
  if(S.avatar==='up'&&S.avatarUp)return `<img src="${esc(S.avatarUp)}" alt="Your profile photo">`;
  const m=/^p:(\d+)$/.exec(S.avatar||'');
  if(m&&AVATARS[+m[1]])return `<span style="font-size:36px;line-height:48px">${AVATARS[+m[1]][0]}</span>`;
  const ini=initials(S.name);return ini?`<span>${esc(ini)}</span>`:IC.profile;
}
const initials=n=>{n=String(n||'').trim();if(!n)return '';const p=n.split(/\s+/);return (p[0][0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase()};
function squareAvatar(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{try{const s=Math.min(img.naturalWidth,img.naturalHeight),sx=(img.naturalWidth-s)/2,sy=(img.naturalHeight-s)/2,c=document.createElement('canvas');c.width=c.height=256;c.getContext('2d').drawImage(img,sx,sy,s,s,0,0,256,256);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.85))}catch(e){rej(e)}};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('load'))};img.src=u})}
function onFile(t){
  const f=t.files&&t.files[0];if(!f)return false;
  if(t.id==='photo'||t.id==='photo-cam'){if(T.prev)URL.revokeObjectURL(T.prev);T.file=f;T.prev=URL.createObjectURL(f);T.found=null;T.scanErr='';t.value='';render();return true}
  if(t.id==='avatar-in'){squareAvatar(f).then(d=>{S.avatarUp=d;S.avatar='up';save();render();toast('Profile photo updated')}).catch(()=>toast('That image could not be used'));t.value='';return true}
  return false;
}
document.addEventListener('change',e=>{if(e.target.type==='file')onFile(e.target);else if(e.target.id==='theme-custom')render()});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.type==='file'){onFile(t);return}
  if(t.id==='theme-custom'){S.theme='custom';S.themeHex=t.value;applyTheme();save();return}
  if(t.dataset.fbind&&T.found){const i=T.found.items.find(x=>x.id===t.dataset.fbind);if(!i)return;if(t.dataset.k==='name'){i.name=t.value}else{const p=parseQty(t.value.replace(/^\s*/,''));const m=String(t.value).match(/^\s*(\d+(?:\.\d+)?)\s*([a-z]*)/i);if(m){i.qty=+m[1];i.unit=(m[2]||'').toLowerCase()}}return}
  const b=t.dataset.bind;if(!b)return;
  let v=t.value;if(t.type==='range'||t.type==='number'||(b.startsWith('body.')&&t.tagName==='SELECT'&&b!=='body.sex'))v=+v;
  setPath(b,v);save();
  if(b.startsWith('taste.')){const k=b.split('.')[1],o=document.getElementById('o-'+k);if(o)o.textContent=LV[v];T.recipes=[]}
  else if(b.startsWith('body.')){const r=$('#bodyres');if(r)r.innerHTML=bodyHtml();T.recipes=[]}
  else if(b==='allergies')T.recipes=[];
  else if(b==='name'){if(!S.avatar){const a=document.querySelector('.avatar span');if(a)a.textContent=initials(v)}}
  else if(b==='route.station'){renderHeader();if(S.tab==='gaps')renderView()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&T.notif){T.notif=false;renderHeader()}});
render();
})();
</script>
